schema_version: "1.1"
name: seeded-app
expected_outcome: |
  Whole-app review of a small document-sharing service with three planted bugs
  (two cross-file) and six decoys. Finds all three with severity in band, flags
  no decoy at Medium or above, and reports findings inline from Critical down.
  `node oracle.mjs files` confirms the planted bugs; after a Harden run every
  value it prints must be false.
context:
